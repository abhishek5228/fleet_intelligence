name: Fleet Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check --select F,E9 .

      - name: Check every module compiles
        run: python -m compileall -q main.py security.py fleet advanced

      - name: Run tests
        run: pytest tests/ -v --cov=fleet --cov=security --cov-report=term-missing

      - name: Importing the app works
        run: |
          python -c "import main; print('app imported:', main.app.title)"
